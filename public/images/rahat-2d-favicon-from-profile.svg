<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Dark Background -->
    <radialGradient id="bg-radial" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#2a1604" />
      <stop offset="55%" stop-color="#120a03" />
      <stop offset="100%" stop-color="#050a15" />
    </radialGradient>
    
    <!-- Golden Amber Frame Glow -->
    <linearGradient id="gold-frame" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Dark Plaid/Check Shirt Gradient -->
    <linearGradient id="shirt" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Warm Skin Gradient -->
    <linearGradient id="skin" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#fcd34d" />
      <stop offset="35%" stop-color="#fba94c" />
      <stop offset="85%" stop-color="#d97736" />
      <stop offset="100%" stop-color="#9a4d25" />
    </linearGradient>

    <!-- Dark Hair Gradient -->
    <linearGradient id="hair" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b18" />
      <stop offset="100%" stop-color="#0a0908" />
    </linearGradient>

    <!-- Banner Gradient -->
    <linearGradient id="banner-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0.95" />
      <stop offset="50%" stop-color="#1e293b" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95" />
    </linearGradient>

    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Favicon Rounded Square Background -->
  <rect width="512" height="512" rx="128" fill="url(#bg-radial)" />
  <rect x="8" y="8" width="496" height="496" rx="120" fill="none" stroke="url(#gold-frame)" stroke-width="8" opacity="0.85" />

  <!-- Subtle Background Tech & Code Text Graphics -->
  <g opacity="0.22" font-family="monospace" font-size="14" fill="#fbbf24" font-weight="bold">
    <text x="60" y="80">&lt;RahatVerse /&gt;</text>
    <text x="310" y="70">const dev = true;</text>
    <text x="50" y="140">import { Skill } from 'BD';</text>
    <text x="330" y="130">// FULL-STACK DEV</text>
    <text x="45" y="240">BNCC #25071152</text>
    <text x="355" y="235">BLOOD DONOR A+</text>
    <text x="70" y="310">HSC • SCIENCE</text>
    <text x="350" y="310">GPA 5.00 (A+)</text>
    
    <!-- Tech Concentric Circles -->
    <circle cx="256" cy="220" r="185" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="6,12" />
    <circle cx="256" cy="220" r="145" fill="none" stroke="#fbbf24" stroke-width="1" stroke-dasharray="3,9" />
  </g>
  
  <!-- Subtle Amber Backlight Glow -->
  <circle cx="256" cy="220" r="160" fill="#f59e0b" opacity="0.25" filter="url(#soft-glow)" />

  <!-- Shoulders / Checkered Shirt -->
  <g transform="translate(0, 36)">
    <path d="M 70 476 C 90 350, 150 330, 256 330 C 362 330, 422 350, 442 476 Z" fill="url(#shirt)" stroke="#334155" stroke-width="3" />
    <!-- Checkered Pattern Grid Lines -->
    <g stroke="#334155" stroke-width="2" opacity="0.4">
      <line x1="120" y1="350" x2="120" y2="476" />
      <line x1="170" y1="340" x2="170" y2="476" />
      <line x1="220" y1="335" x2="220" y2="476" />
      <line x1="290" y1="335" x2="290" y2="476" />
      <line x1="340" y1="340" x2="340" y2="476" />
      <line x1="390" y1="350" x2="390" y2="476" />
      <line x1="80" y1="380" x2="432" y2="380" />
      <line x1="85" y1="420" x2="427" y2="420" />
      <line x1="90" y1="460" x2="422" y2="460" />
    </g>
    <!-- Open Collar -->
    <path d="M 186 335 L 210 400 L 256 440 L 302 400 L 326 335" fill="none" stroke="url(#gold-frame)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.85" />
  </g>

  <!-- Neck -->
  <path d="M 220 286 L 218 350 Q 256 368, 294 350 L 292 286 Z" fill="url(#skin)" />
  <path d="M 220 292 Q 256 318, 292 292" fill="none" stroke="#000000" stroke-opacity="0.22" stroke-width="10" />

  <!-- Head Base / Face Silhouette -->
  <g id="head">
    <!-- Ears -->
    <circle cx="168" cy="226" r="22" fill="url(#skin)" />
    <circle cx="344" cy="226" r="22" fill="url(#skin)" />
    
    <!-- Face Contour -->
    <path d="M 178 180 C 178 120, 334 120, 334 180 C 340 244, 320 300, 256 314 C 192 300, 172 244, 178 180 Z" fill="url(#skin)" />

    <!-- Eyebrows (Strong, well-defined) -->
    <path d="M 200 200 Q 222 192, 240 200" fill="none" stroke="#1e1b18" stroke-width="6.5" stroke-linecap="round" />
    <path d="M 312 200 Q 290 192, 272 200" fill="none" stroke="#1e1b18" stroke-width="6.5" stroke-linecap="round" />

    <!-- Eyes (Calm, Confident) -->
    <path d="M 204 220 Q 220 216, 236 222" fill="none" stroke="#1e1b18" stroke-width="4" stroke-linecap="round" />
    <circle cx="220" cy="223" r="5" fill="#1e1b18" />
    <path d="M 308 220 Q 292 216, 276 222" fill="none" stroke="#1e1b18" stroke-width="4" stroke-linecap="round" />
    <circle cx="292" cy="223" r="5" fill="#1e1b18" />

    <!-- Nose -->
    <path d="M 256 224 L 250 256 Q 256 262, 264 256" fill="none" stroke="#9a4d25" stroke-width="3.5" stroke-linecap="round" opacity="0.65" />

    <!-- Neat Mustache -->
    <path d="M 226 276 Q 256 270, 286 276" fill="none" stroke="#2a1f18" stroke-width="3.5" stroke-linecap="round" opacity="0.85" />

    <!-- Calm Confident Smile -->
    <path d="M 234 288 Q 256 294, 278 288" fill="none" stroke="#7c2d12" stroke-width="4.5" stroke-linecap="round" />

    <!-- Light Trimmed Goatee & Beard Shadow -->
    <path d="M 234 304 Q 256 312, 278 304" fill="none" stroke="#2a1f18" stroke-width="4.5" stroke-linecap="round" opacity="0.85" />
    <path d="M 194 286 Q 256 314, 318 286" fill="none" stroke="#2a1f18" stroke-width="2" stroke-dasharray="3,4" opacity="0.5" />

    <!-- Stylish Pompadour / Brushed-Back Volume Hair -->
    <path d="M 166 186 C 158 135, 186 75, 256 68 C 326 75, 354 135, 346 186 C 342 160, 316 130, 256 125 C 196 130, 170 160, 166 186 Z" fill="url(#hair)" />
    <!-- Swept-Back Textured Waves on Top -->
    <path d="M 188 110 C 212 70, 268 62, 316 92 C 282 78, 240 84, 212 114 Z" fill="url(#hair)" />
    <path d="M 220 80 C 250 60, 285 64, 308 80 C 285 70, 250 74, 220 88 Z" fill="url(#hair)" opacity="0.7" />
  </g>

  <!-- Bottom Name Banner ("RAHAT AHMED") -->
  <g transform="translate(106, 420)">
    <rect width="300" height="52" rx="26" fill="url(#banner-grad)" stroke="url(#gold-frame)" stroke-width="3" />
    <text x="150" y="33" font-family="'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="900" fill="#fbbf24" text-anchor="middle" letter-spacing="3">RAHAT AHMED</text>
  </g>
</svg>
