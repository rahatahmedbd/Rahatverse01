<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bg-bncc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#051e18" />
      <stop offset="50%" stop-color="#0f3d32" />
      <stop offset="100%" stop-color="#115e4b" />
    </linearGradient>
    <radialGradient id="glow-bncc" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg-bncc)" />
  <circle cx="400" cy="300" r="230" fill="url(#glow-bncc)" />
  <!-- Grid Lines -->
  <g stroke="#ffffff" stroke-opacity="0.05" stroke-width="1">
    <line x1="0" y1="150" x2="800" y2="150" />
    <line x1="0" y1="300" x2="800" y2="300" />
    <line x1="0" y1="450" x2="800" y2="450" />
    <line x1="200" y1="0" x2="200" y2="600" />
    <line x1="400" y1="0" x2="400" y2="600" />
    <line x1="600" y1="0" x2="600" y2="600" />
  </g>
  <!-- Shield & Cadet Star -->
  <g transform="translate(400, 300) scale(1.3)" stroke="#10b981" stroke-width="3" fill="none">
    <path d="M-60 -50 L0 -70 L60 -50 L60 10 C60 50 0 80 0 80 C0 80 -60 50 -60 10 Z" fill="#10b981" fill-opacity="0.15" />
    <polygon points="0,-35 10,-10 35,-10 15,5 23,30 0,15 -23,30 -15,5 -35,-10 -10,-10" fill="#fbbf24" stroke="#f59e0b" stroke-width="2" />
  </g>
  <!-- Decorative Text -->
  <text x="60" y="80" fill="#a7f3d0" font-family="sans-serif" font-size="16" font-weight="bold" letter-spacing="4">BNCC CADET LEADERSHIP</text>
  <text x="60" y="115" fill="#ffffff" font-family="sans-serif" font-size="28" font-weight="800" opacity="0.9">Discipline, Unity &amp; National Service</text>
  <rect x="60" y="135" width="80" height="3" fill="#10b981" rx="1.5" />
</svg>
