<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bg-web" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#180e04" />
      <stop offset="50%" stop-color="#3d2109" />
      <stop offset="100%" stop-color="#581c3c" />
    </linearGradient>
    <radialGradient id="glow-web" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg-web)" />
  <circle cx="400" cy="300" r="230" fill="url(#glow-web)" />
  <!-- Grid Lines -->
  <g stroke="#ffffff" stroke-opacity="0.05" stroke-width="1">
    <line x1="0" y1="150" x2="800" y2="150" />
    <line x1="0" y1="300" x2="800" y2="300" />
    <line x1="0" y1="450" x2="800" y2="450" />
    <line x1="200" y1="0" x2="200" y2="600" />
    <line x1="400" y1="0" x2="400" y2="600" />
    <line x1="600" y1="0" x2="600" y2="600" />
  </g>
  <!-- Code Brackets & Tech -->
  <g transform="translate(400, 300) scale(1.4)" stroke="#f59e0b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M-50 -35 L-80 0 L-50 35" />
    <path d="M50 -35 L80 0 L50 35" />
    <line x1="-15" y1="40" x2="15" y2="-40" stroke="#ec4899" />
  </g>
  <!-- Decorative Text -->
  <text x="60" y="80" fill="#fde68a" font-family="sans-serif" font-size="16" font-weight="bold" letter-spacing="4">MODERN WEB DEVELOPMENT</text>
  <text x="60" y="115" fill="#ffffff" font-family="sans-serif" font-size="28" font-weight="800" opacity="0.9">Next.js, UI/UX Design &amp; Fullstack Engineering</text>
  <rect x="60" y="135" width="80" height="3" fill="#f59e0b" rx="1.5" />
</svg>
