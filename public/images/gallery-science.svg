<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bg-sci" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f24" />
      <stop offset="50%" stop-color="#111c4e" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </linearGradient>
    <radialGradient id="glow-sci" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg-sci)" />
  <circle cx="400" cy="300" r="230" fill="url(#glow-sci)" />
  <!-- Grid Lines -->
  <g stroke="#ffffff" stroke-opacity="0.05" stroke-width="1">
    <line x1="0" y1="150" x2="800" y2="150" />
    <line x1="0" y1="300" x2="800" y2="300" />
    <line x1="0" y1="450" x2="800" y2="450" />
    <line x1="200" y1="0" x2="200" y2="600" />
    <line x1="400" y1="0" x2="400" y2="600" />
    <line x1="600" y1="0" x2="600" y2="600" />
  </g>
  <!-- Atom Rings -->
  <g transform="translate(400, 300)" stroke="#38bdf8" stroke-width="3" fill="none" opacity="0.8">
    <ellipse rx="130" ry="45" transform="rotate(30)" />
    <ellipse rx="130" ry="45" transform="rotate(90)" />
    <ellipse rx="130" ry="45" transform="rotate(150)" />
    <circle cx="0" cy="0" r="18" fill="#38bdf8" />
  </g>
  <!-- Decorative Text -->
  <text x="60" y="80" fill="#bae6fd" font-family="sans-serif" font-size="16" font-weight="bold" letter-spacing="4">SCIENCE &amp; TECHNOLOGY WEEK 2025</text>
  <text x="60" y="115" fill="#ffffff" font-family="sans-serif" font-size="28" font-weight="800" opacity="0.9">District Level Innovation &amp; Project Exhibition</text>
  <rect x="60" y="135" width="80" height="3" fill="#38bdf8" rx="1.5" />
</svg>
